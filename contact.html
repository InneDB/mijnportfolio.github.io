<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/normalize.css">

</head>
<body>
    <header>
        <nav>
            <input type="checkbox" id="hamburger">
            <label for="hamburger" class="hamburger">
                <img src="images/hamburgermenu.png" alt="hamburgermenu">
            </label>

            <div class="slider">
                <a href="index.html">Home</a>
                <a href="index.html">Projecten</a>
                <a href="contact.html">Contact</a>
            </div>

            <div class="topnav">
                <a href="index.html">Home</a>
                <a href="index.html">Projecten</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    <div class="hero">
        <div class="hero-text-contact">
            <h1><span class="highlight">Vragen?</span><br>Over projecten of iets anders</h1>
            <p>Stuur me gerust een mailtje. Bellen kan ook, maar mijn generatie is daar geen fan van. Psst... op een mailtje reageer ik meestal sneller.</p>
            
            <div class="contactgegevens">
                <img src="images/email-icon.png" alt="icoon e-mail">
                <p>innedebaerdemaeker@telenet.be</p>
            </div>
            <div class="contactgegevens">
                <img src="images/phone-icon.png" alt="icoon e-mail">
                <p>+32 489 16 06 87 </p>
            </div>
        </div> 

        <div class="contactformulier">
            <form>
                <div>
                    <label for="naam">naam</label><br>
                    <input id="naam" type="text">
                </div>
                <div>
                    <label for="email">e-mail</label><br>
                    <input id="email" type="text">
                </div>
                <div>
                    <label for="bericht">bericht</label><br>
                    <input id="bericht" type="text">
                </div>
                <div class="submit">
                    <input class="submit-btn" type="submit">
                </div>
            </form>

            <img id="cirkel-contact" src="images/circle.svg" alt="cirkel element">
            <img id="zigzag-contact" src="images/zigzag_pink.svg" alt="zigzag element">
        </div>
    </div>
    </header>
